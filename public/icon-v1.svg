<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="DuoSpend">
  <defs>
    <linearGradient id="dsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="55%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <radialGradient id="dsGlow" cx="76%" cy="22%" r="58%">
      <stop offset="0%" stop-color="#fff7ed" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#fff7ed" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#dsBg)" />
  <rect width="512" height="512" rx="116" fill="url(#dsGlow)" />
  <rect x="18" y="18" width="476" height="476" rx="100" fill="none" stroke="#fed7aa" stroke-opacity="0.3" stroke-width="4" />

  <!-- Partner arches sharing the central coin -->
  <path
    d="M 206 184 A 104 104 0 0 0 206 368"
    fill="none"
    stroke="#fff7ed"
    stroke-width="40"
    stroke-linecap="round"
  />
  <path
    d="M 306 184 A 104 104 0 0 1 306 368"
    fill="none"
    stroke="#fed7aa"
    stroke-width="40"
    stroke-linecap="round"
  />

  <!-- Shared 50/50 coin -->
  <circle cx="256" cy="276" r="58" fill="#fff7ed" />
  <rect x="228" y="253" width="56" height="16" rx="8" fill="#c2410c" />
  <rect x="228" y="283" width="56" height="16" rx="8" fill="#c2410c" />

  <!-- Couple union heart -->
  <path
    d="M 256 168 C 234 152 218 139 218 122 A 20 20 0 0 1 256 113 A 20 20 0 0 1 294 122 C 294 139 278 152 256 168 Z"
    fill="#fb7185"
    stroke="#fff7ed"
    stroke-width="6"
