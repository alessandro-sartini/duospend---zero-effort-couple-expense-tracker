services:
  duospend:
    container_name: duospend_app
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      DB_PATH: /app/data/duospend.sqlite
